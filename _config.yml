# GitHub Pages builds this site automatically with Jekyll on every push to main.
# Docs: https://docs.github.com/pages/setting-up-a-github-pages-site-with-jekyll

title: Everyday Labs
description: >-
  Small, useful, open-source apps for everyday problems.
email: hello@everyday-labs.org
github_username: everyday-labs
# Organization logo for search engines (jekyll-seo-tag JSON-LD).
logo: /assets/logos/mark-512.png

theme: minima

# Pages shown in the top navigation bar, in this order.
header_pages:
  - bulkmate/index.html
  - about.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Jekyll skips dot-folders by default; Apple fetches the universal-link file from here.
include:
  - .well-known

exclude:
  - README.md
